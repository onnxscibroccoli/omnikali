name: Probe OmniKali gateway

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [register-endpoint]

permissions:
  contents: write

concurrency:
  group: probe-endpoint
  cancel-in-progress: false

jobs:
  probe:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
      - name: Verify discovery policy before network access
        run: node --test scripts/*.test.mjs
      - name: Probe approved candidates and stage validated endpoint.json
        run: node .github/scripts/probe-endpoint.mjs
      - name: Reject unapproved endpoint updates
        run: node scripts/validate-endpoint-record.mjs
      - name: Commit if the service record changed
        run: |
          set -euo pipefail
          git config user.name "omnikali-probe"
          git config user.email "304189395+onnxscibroccoli@users.noreply.github.com"
          git add endpoint.json
          if git diff --cached --quiet; then
            echo unchanged
            exit 0
          fi
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git add endpoint.json
          if git diff --cached --quiet; then
            echo unchanged-after-rebase
            exit 0
          fi
          git commit -m "chore: refresh endpoint.json from public health probe"
          git push origin "HEAD:${GITHUB_REF_NAME}"
