name: Discovery contract verification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Offline endpoint policy and publication contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: JavaScript syntax and endpoint validation
        run: |
          node --check scripts/discovery-contract.mjs
          node --check scripts/validate-endpoint-record.mjs
          node --check .github/scripts/probe-endpoint.mjs
          node scripts/validate-endpoint-record.mjs
      - name: Adversarial contract regression suite (offline)
        run: node --test scripts/*.test.mjs
